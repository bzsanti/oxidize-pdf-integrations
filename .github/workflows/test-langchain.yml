name: Test — LangChain Loader

on:
  pull_request:
    paths:
      - "langchain/**"
      - "mcp/server.json"
      - ".github/workflows/test-langchain.yml"
  push:
    branches: [main]
    paths:
      - "langchain/**"
      - "mcp/server.json"
      - ".github/workflows/test-langchain.yml"

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: langchain
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          BRIDGE_VERSION=$(python -c 'import json; print(json.load(open("../mcp/server.json"))["packages"][0]["version"])')
          pip install -e . "oxidize-pdf==$BRIDGE_VERSION"
          pip install pytest

      - name: Run tests
        run: pytest -q
