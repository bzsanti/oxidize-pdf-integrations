[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haystack-oxidize-pdf"
version = "0.1.0"
description = "Haystack converter for oxidize-pdf — fast, Rust-powered PDF parsing with element-disjoint RAG chunking, ByteStream-aware"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [
    { name = "Santiago Fernández Muñoz" },
]
keywords = ["haystack", "haystack-ai", "converter", "pdf", "rag", "oxidize-pdf", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "haystack-ai>=2.0,<3",
    # 0.4.3 ships oxidize-pdf-core 2.5.5, which fixes the HybridChunker
    # overlap branch that made rag_chunks() emit accumulating
    # (non-disjoint) chunks. Disjointness regression tests in this
    # package require the fix — any 0.4.x ≥ 0.4.3 (and forward into
    # 0.5.x) is acceptable.
    "oxidize-pdf>=0.4.3",
]

[project.urls]
Homepage = "https://github.com/bzsanti/oxidize-pdf-integrations"
Repository = "https://github.com/bzsanti/oxidize-pdf-integrations"
Issues = "https://github.com/bzsanti/oxidize-pdf-integrations/issues"

[tool.hatch.build.targets.sdist]
include = ["haystack_oxidize_pdf/"]

[tool.hatch.build.targets.wheel]
include = ["haystack_oxidize_pdf/"]
